# Database roles (see migration b7d419e3f2a8):
#   backend / celery_worker / celery_beat connect as `dataops_app` via
#   DATABASE_URL in .env — a NOSUPERUSER, NOBYPASSRLS role. This is load-bearing:
#   Row-Level Security is silently and completely bypassed by superuser and
#   BYPASSRLS roles, so pointing DATABASE_URL back at `dataops_user` would leave
#   every RLS policy in place but enforcing nothing.
#   `dataops_user` (the POSTGRES_USER below, superuser/owner) is reached only via
#   ADMIN_DATABASE_URL, and only by migrations, test_schema_drift.py, and
#   cross-tenant maintenance scripts.
services:
  backend:
    build: ./backend
    container_name: dataops_backend
    restart: unless-stopped
    env_file: .env
    ports: [ "8000:8000" ]
    depends_on: [ postgres, redis ]
    # upload_data is shared with celery_worker: uploads.py writes to
    # ~/dataops_uploads (i.e. /root/dataops_uploads), which is NOT under
    # /app — without this, files uploaded via this container are invisible
    # to celery_worker, so any pipeline sync against an uploaded file fails
    # immediately (not just after a rebuild).
    volumes: [ "./backend:/app", "upload_data:/root/dataops_uploads" ]
    networks: [ dataops_net ]

  # frontend:
  #   build: ./frontend
  #   container_name: dataops_frontend
  #   restart: unless-stopped
  #   ports: [ "3000:3000" ]
  #   depends_on: [ backend ]
  #   networks: [ dataops_net ]

  postgres:
    image: postgres:16-alpine
    container_name: dataops_postgres
    restart: unless-stopped
    # max_connections=200 (2026-09, up from the image default of 100): backend +
    # celery_worker (--concurrency=4, 4 independent OS processes) + celery_beat each
    # build their own SQLAlchemy pool from database.py -- see that file for the
    # per-process ceiling math this pairs with. Raised alongside, not instead of,
    # shrinking that ceiling; either alone left too little headroom for the test
    # client this was found under.
    command: postgres -c max_connections=200
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dataops}
      POSTGRES_USER: ${POSTGRES_USER:-dataops_user}
      # `:?` not `:-`: a missing .env must fail loudly here, not silently boot a
      # database whose password is a string on GitHub. Note this only governs
      # volume INITIALISATION — see GOTCHAS on rotating an existing volume.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?must be set in dataops-agent/.env}
    volumes: [ pg_data:/var/lib/postgresql/data ]
    ports: [ "5432:5432" ]
    networks: [ dataops_net ]

  redis:
    image: redis:7-alpine
    container_name: dataops_redis
    restart: unless-stopped
    ports: [ "6379:6379" ]
    networks: [ dataops_net ]

  celery_worker:
    build: ./backend
    container_name: dataops_celery
    restart: unless-stopped
    command: celery -A services.celery_app worker --loglevel=info --concurrency=4
    env_file: .env
    depends_on: [ postgres, redis ]
    volumes: [ "./backend:/app", "upload_data:/root/dataops_uploads" ]
    networks: [ dataops_net ]

  celery_beat:
    build: ./backend
    container_name: dataops_beat
    restart: unless-stopped
    command: celery -A services.celery_app beat --loglevel=info
    env_file: .env
    depends_on: [ postgres, redis ]
    volumes: [ "./backend:/app" ]
    networks: [ dataops_net ]

volumes:
  pg_data:
  upload_data:
networks:
  dataops_net:
    driver: bridge
