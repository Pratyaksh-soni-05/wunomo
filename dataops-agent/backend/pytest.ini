[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
markers =
    live_llm: makes a real call to a live LLM provider and spends real
        quota (2026-08 - see docs/context/GOTCHAS.md). Excluded from the
        default run; pass -m live_llm explicitly to include it.
addopts = -m "not live_llm"
